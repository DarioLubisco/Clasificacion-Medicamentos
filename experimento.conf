# ============================================================
# EXPERIMENTO.CONF — Control central de evaluaciones
# Editar aquí. NO tocar los scripts .py para cada prueba.
# ============================================================

[experimento]
nombre = glm_vs_deepseek_3_productos_vision
descripcion = Mismos 3 EANs, mismas fuentes web e imágenes que eval_20_vision (pipeline real)
activo = true

[entrada]
# archivo_json | eans_lista | resultados_previos
modo = eans_lista
# JSON generado para el runner (subset filtrado del dataset real)
archivo_json = scratch/eval_from_conf.json
# Dataset REAL con scraping (fuentes_web + URLs de imágenes)
archivo_entrada = scratch/eval_20_vision.json
# Baseline DeepSeek corrido con el MISMO dataset y pipeline de visión
archivo_referencia = scratch/resultados_20_vision.json

[productos]
# EANs exactos del experimento DeepSeek vision (comparativa justa)
eans = 900000000001, 900000000014, 900000000018
# cantidad = 10
# semilla_aleatoria = 42

[lote]
batch_size = 1

[modelo_texto]
proveedor = zai
modelo = glm-4.7
temperature = 0.2
max_tokens = 4000

[modelo_vision]
# mimo = Xiaomi Token Plan directo | openrouter = Gemini u otros
activo = true
proveedor = mimo
modelo = mimo-v2.5
thinking = disabled
api_url = https://token-plan-sgp.xiaomimimo.com/v1
umbral_legibilidad = 3
max_imagenes_prefiltro = 10
max_imagenes_ocr = 4

[prompt]
archivo = prompt_agente_v3_solidificado_final.txt

[taxonomias]
modo = cache_local
archivo_cache = scratch/taxonomias_local.txt

[salida]
directorio = scratch
archivo_resultados = experimento_glm_batch1_vision.json
archivo_excel =
guardar_incremental = true

[comparativa]
activa = true
archivo_baseline = scratch/resultados_20_vision.json
modelo_baseline = deepseek_v4_flash
archivo_reporte = scratch/comparativa_experimento_vision.xlsx

[credenciales]
archivo = ../../N8N/synapse.credentials

[ejecucion]
# true = solo prepara JSON y muestra plan; false = llama APIs reales
dry_run = false
